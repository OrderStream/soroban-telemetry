[package]
name = "soroban-telemetry"
version = "0.1.0"
edition = "2021"
authors = ["OrderStream <healthdecoded77@gmail.com>"]
description = "High-speed event listener and storage TTL monitor daemon for Stellar Soroban with abnormal gas surge detection and webhook dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrderStream/soroban-telemetry"
readme = "README.md"
keywords = ["stellar", "soroban", "telemetry", "events", "monitoring"]

[[bin]]
name = "soroban-telemetry"
path = "src/main.rs"

[lib]
name = "soroban_telemetry"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
hmac = "0.12.1"
thiserror = "2.0"
